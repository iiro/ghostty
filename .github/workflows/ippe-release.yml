name: Ippe Release

# Builds "Ghostty by Ippe" for macOS and Linux and publishes one GitHub
# release with all builds attached.
#
# Version: <commit date YYYY.MM.DD>-<short hash>, e.g. 2026.10.24-61b3e64.
# The tag is the version prefixed with "ippe-". Using the commit date (UTC)
# instead of the build date means the same commit always gets the same
# version. Builds are not notarized (macOS) or packaged for a distro (Linux).
#
# The macOS app updates itself with Sparkle from the appcast.xml attached to
# the latest release. The zip is signed with the SPARKLE_PRIVATE_KEY secret,
# whose public key is SUPublicEDKey in macos/Ghostty-Info.plist.

on:
  # Every push to ippe releases that commit. Documentation-only pushes are
  # skipped; run the workflow manually to release one anyway.
  push:
    branches: [ippe]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ippe-release
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.0
  BLUEPRINT_COMPILER_VERSION: v0.20.4
  SPARKLE_VERSION: 2.9.6

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: |
          date=$(TZ=UTC git log -1 --date=format-local:%Y.%m.%d --format=%cd)
          hash=$(git rev-parse --short=7 HEAD)
          version="$date-$hash"
          # CFBundleVersion, which Sparkle compares to find newer builds: the
          # commit time, so releases on the same day still sort in order.
          build=$(TZ=UTC git log -1 --date=format-local:%Y%m%d%H%M%S --format=%cd)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=ippe-$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-26
          # Ghostty needs libadwaita 1.7+ to build, newer than the Ubuntu 24.04
          # runners ship, so Linux builds run in an Ubuntu 26.04 container.
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: ubuntu:26.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Runs before checkout because the container needs git for full history.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates xz-utils \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev \
            gettext libxml2-utils pkg-config \
            meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so Ghostty's build can derive its own version from git.
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # macOS

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: zig build -Doptimize=ReleaseFast

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="ippe-dist/Ghostty by Ippe.app"
          mkdir -p ippe-dist
          cp -R zig-out/Ghostty.app "$app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.build }}" "$plist"
          # Local builds only check for updates when asked; releases follow
          # Ghostty's auto-update setting, as upstream's releases do.
          /usr/libexec/PlistBuddy -c "Delete :SUEnableAutomaticChecks" "$plist"
          # Editing Info.plist invalidates the signature, so re-sign ad-hoc.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/ghostty"
          ditto -c -k --sequesterRsrc --keepParent "$app" "ippe-dist/Ghostty-by-Ippe-$VERSION-macos-universal.zip"
          rm -rf "$app"

      - name: Sign update and write appcast (macOS)
        if: runner.os == 'macOS'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret is not set, so the update can't be signed."
            exit 1
          fi
          # The same Sparkle version the app links (macos/.../Package.resolved).
          curl -fsSL -o "$RUNNER_TEMP/sparkle.zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip"
          unzip -q "$RUNNER_TEMP/sparkle.zip" -d "$RUNNER_TEMP/sparkle"
          sign_update="$RUNNER_TEMP/sparkle/bin/sign_update"
          zip="ippe-dist/Ghostty-by-Ippe-$VERSION-macos-universal.zip"
          signature=$(echo "$SPARKLE_PRIVATE_KEY" | "$sign_update" --ed-key-file - "$zip")
          .github/scripts/ippe-appcast.sh "$VERSION" "${{ needs.version.outputs.build }}" \
            "${{ needs.version.outputs.tag }}" "$zip" "$signature" > ippe-dist/appcast.xml
          cat ippe-dist/appcast.xml

      # Linux

      # Ghostty needs blueprint-compiler 0.20+, newer than Ubuntu 26.04 ships.
      - name: Install blueprint-compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch "$BLUEPRINT_COMPILER_VERSION" \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git /tmp/blueprint-compiler
          meson setup /tmp/blueprint-compiler/build /tmp/blueprint-compiler --prefix=/usr/local
          ninja -C /tmp/blueprint-compiler/build install
          blueprint-compiler --version

      - name: Build (Linux)
        if: runner.os == 'Linux'
        # Baseline CPU so the binary runs on any machine of this architecture.
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          zig-out/bin/ghostty +version
          mkdir -p ippe-dist
          tar -C zig-out -czf "ippe-dist/Ghostty-by-Ippe-$VERSION-${{ matrix.name }}.tar.gz" bin share

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ippe-dist/Ghostty-by-Ippe-*
            ippe-dist/appcast.xml
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: ippe-dist
          merge-multiple: true

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          .github/scripts/ippe-release-notes.sh "${{ needs.version.outputs.tag }}" "$prev" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la ippe-dist
          gh release create "${{ needs.version.outputs.tag }}" ippe-dist/Ghostty-by-Ippe-* ippe-dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ghostty by Ippe ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

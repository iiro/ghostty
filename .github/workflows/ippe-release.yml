name: Ippe Release

# Builds "Ghostty by Ippe" for macOS and Linux and publishes one GitHub
# release with all builds attached.
#
# Version: <commit date YYYY.MM.DD>-<short hash>, e.g. 2026.10.24-61b3e64.
# The tag is the version prefixed with "ippe-". Using the commit date (UTC)
# instead of the build date means the same commit always gets the same
# version. Builds are not notarized (macOS) or packaged for a distro (Linux).

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ippe-release
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.17.0
  BLUEPRINT_COMPILER_VERSION: v0.20.4

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: |
          date=$(TZ=UTC git log -1 --date=format-local:%Y.%m.%d --format=%cd)
          hash=$(git rev-parse --short=7 HEAD)
          version="$date-$hash"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$date" >> "$GITHUB_OUTPUT"
          echo "tag=ippe-$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Skip if already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-26
          # Ghostty needs libadwaita 1.7+ to build, newer than the Ubuntu 24.04
          # runners ship, so Linux builds run in an Ubuntu 26.04 container.
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: ubuntu:26.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Runs before checkout because the container needs git for full history.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates xz-utils \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev \
            gettext libxml2-utils pkg-config \
            meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so Ghostty's build can derive its own version from git.
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # macOS

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: zig build -Doptimize=ReleaseFast

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/Ghostty by Ippe.app"
          mkdir -p dist
          cp -R zig-out/Ghostty.app "$app"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.build }}" "$plist"
          # Editing Info.plist invalidates the signature, so re-sign ad-hoc.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/ghostty"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Ghostty-by-Ippe-$VERSION-macos-universal.zip"
          rm -rf "$app"

      # Linux

      # Ghostty needs blueprint-compiler 0.20+, newer than Ubuntu 26.04 ships.
      - name: Install blueprint-compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch "$BLUEPRINT_COMPILER_VERSION" \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git /tmp/blueprint-compiler
          meson setup /tmp/blueprint-compiler/build /tmp/blueprint-compiler --prefix=/usr/local
          ninja -C /tmp/blueprint-compiler/build install
          blueprint-compiler --version

      - name: Build (Linux)
        if: runner.os == 'Linux'
        # Baseline CPU so the binary runs on any machine of this architecture.
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          zig-out/bin/ghostty +version
          mkdir -p dist
          tar -C zig-out -czf "dist/Ghostty-by-Ippe-$VERSION-${{ matrix.name }}.tar.gz" bin share

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ghostty by Ippe ${{ needs.version.outputs.version }}" \
            --notes "Built from ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}.

          **macOS** (universal): unzip, move \`Ghostty by Ippe.app\` to /Applications, then run:

          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/Ghostty by Ippe.app\"
          \`\`\`

          The app is ad-hoc signed and not notarized, so macOS blocks it until the quarantine flag is removed.

          **Linux** (x86_64 or aarch64): built on Ubuntu 26.04, so it needs a similarly recent distro: glibc 2.43+, GTK 4 and libadwaita 1.7+, and gtk4-layer-shell (e.g. Ubuntu 26.04, or a current Fedora or Arch). Extract into \`~/.local\` with \`tar -xzf <file>.tar.gz -C ~/.local\` and make sure \`~/.local/bin\` is on your PATH. On Linux the app ID is still upstream's \`com.mitchellh.ghostty\`, so this replaces rather than runs beside an official Ghostty install. The link fix uses Ctrl+click on Linux."
